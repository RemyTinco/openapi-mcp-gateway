name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest

  lowest-deps:
    name: lowest direct dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # `uv pip` resolves into a throwaway environment and never touches uv.lock.
      - name: Install the lowest allowed version of each direct dependency
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest/bin/python" \
            --resolution lowest-direct \
            -e . "pytest>=8" "pytest-asyncio>=0.24"
      - run: "$RUNNER_TEMP/lowest/bin/python -m pytest"
